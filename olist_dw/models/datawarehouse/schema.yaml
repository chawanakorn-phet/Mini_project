version: 2

models:
  - name: dim_customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: dim_sellers
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null

  - name: dim_products
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: dim_date
    columns:
      - name: id
        tests:
          - unique
          - not_null

  - name: fact_order_items
    columns:
      - name: order_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null

  - name: fact_order_payments
    columns:
      - name: order_id
        tests:
          - not_null

  - name: fact_order_reviews
    columns:
      - name: review_id
        tests:
          - unique
          - not_null
